# Gradle JVM settings - optimized for faster builds
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution
org.gradle.parallel=true

# Enable configuration caching (speeds up configuration phase)
# Disabled due to compatibility issues with Flutter Gradle plugin
# org.gradle.configuration-cache=true

# Enable build cache
org.gradle.caching=true

# Android settings
android.useAndroidX=true
android.enableJetifier=false

# Kotlin settings
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true

# Enable R8 full mode for better optimization
android.enableR8.fullMode=true
